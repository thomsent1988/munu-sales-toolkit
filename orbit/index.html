<title>Munu Orbit</title>
<style>
  @font-face{
    font-family:'Fira Sans Black';
    src:url('../fonts/FiraSans-Black.ttf') format('truetype');
    font-weight:900; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Inter SemiBold';
    src:url('../fonts/Inter-SemiBold.ttf') format('truetype');
    font-weight:600; font-style:normal; font-display:swap;
  }
  @font-face{
    font-family:'Inter Medium';
    src:url('../fonts/Inter-Medium.ttf') format('truetype');
    font-weight:500; font-style:normal; font-display:swap;
  }

  :root{
    --ink:#000743;
    --ink-deep:#00031f;
    --mist:#D6F3FF;
    --paper:#F9FBFF;
    --bloom:#F1B7F2;
    --grey3:#8E90A2;
    --grey4:#53546F;
    --grey1:#ECEFF6;

    --r-sm:10px;
    --r-md:18px;
    --r-lg:28px;
    --r-pill:999px;

    --ease-snap:cubic-bezier(1,0,0,1);
    --ease-smooth:cubic-bezier(.5,0,0,1);

    --fs-display:clamp(2.1rem,5vw,3.6rem);
    --fs-h2:clamp(1.15rem,2vw,1.5rem);
    --fs-body:1rem;
    --fs-small:.82rem;
    --fs-eyebrow:.78rem;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(120% 140% at 50% -10%, #001066 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color:var(--paper);
    font-family:'Inter Medium', system-ui, sans-serif;
    font-weight:500;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fira Sans Black', system-ui, sans-serif; font-weight:900; letter-spacing:-0.01em; line-height:1; margin:0; text-wrap:balance; }
  p{ margin:0; line-height:1.5; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--bloom); outline-offset:3px; border-radius:6px; }

  .subhead{ font-family:'Inter SemiBold', system-ui, sans-serif; font-weight:600; letter-spacing:-0.01em; }
  .eyebrow{
    font-family:'Inter SemiBold', system-ui, sans-serif;
    font-size:var(--fs-eyebrow);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mist);
    opacity:.72;
  }

  #app{ position:relative; min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px clamp(16px,4vw,40px);
    background:linear-gradient(180deg, rgba(0,7,67,.92) 0%, rgba(0,7,67,.55) 70%, transparent 100%);
    backdrop-filter:blur(6px);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ height:22px; width:auto; display:block; }
  .lang-toggle{
    display:flex; background:rgba(214,243,255,.08); border:1px solid rgba(214,243,255,.22);
    border-radius:var(--r-pill); padding:3px; gap:2px;
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--mist);
    font-family:'Inter SemiBold', system-ui, sans-serif; font-size:.78rem;
    padding:6px 14px; border-radius:var(--r-pill);
    transition:background .25s var(--ease-smooth), color .25s var(--ease-smooth);
  }
  .lang-toggle button.active{ background:var(--mist); color:var(--ink); }
  .lang-toggle button:not(.active):hover{ background:rgba(214,243,255,.16); }

  main{ flex:1; position:relative; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- wipe transition ---------- */
  #wipe{
    position:fixed; inset:0; z-index:60;
    background:var(--mist);
    transform:translateX(-100%);
    pointer-events:none;
  }
  @keyframes wipeSweep{
    0%{ transform:translateX(-100%); }
    50%{ transform:translateX(0); }
    100%{ transform:translateX(100%); }
  }
  #wipe.sweeping{ animation:wipeSweep .8s var(--ease-smooth); }

  /* ---------- home ---------- */
  #view-home{ padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 60px; max-width:1180px; margin:0 auto; }

  .home-hub{ text-align:center; max-width:560px; margin:0 auto 8px; }
  .home-hub .home-tagline{ font-size:var(--fs-h2); font-family:'Fira Sans Black'; font-weight:900; margin-top:14px; }

  .present-btn{
    margin-top:20px; display:inline-flex; align-items:center; gap:10px;
    background:var(--mist); color:var(--ink); border:none;
    font-family:'Inter SemiBold', system-ui, sans-serif; font-size:.92rem;
    padding:13px 26px 13px 20px; border-radius:var(--r-pill);
    transition:background .25s var(--ease-snap), gap .25s var(--ease-snap);
  }
  .present-btn:hover, .present-btn:focus-visible{ background:var(--bloom); gap:14px; }
  .present-btn svg{ width:15px; height:15px; }

  .orbit-wrap{
    position:relative;
    width:min(92vmin,620px); height:min(92vmin,620px);
    margin:64px auto 8px;
  }
  .orbit-ring{
    position:absolute; inset:8%;
    border:1px dashed rgba(214,243,255,.22);
    border-radius:50%;
  }
  .hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:clamp(96px,16vmin,140px); height:clamp(96px,16vmin,140px);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(214,243,255,.22), rgba(214,243,255,.03) 60%), rgba(214,243,255,.06);
    border:1px solid rgba(214,243,255,.3);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 60px rgba(214,243,255,.15);
    z-index:2;
  }
  .hub img{ width:58%; height:auto; }

  .nodes{ position:absolute; inset:0; z-index:3; }

  .node{
    position:absolute;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:clamp(64px,18vmin,104px);
    padding:clamp(10px,2.4vmin,14px) 6px 10px; text-align:center;
    background:rgba(0,7,67,.55);
    border:1px solid rgba(214,243,255,.28);
    border-radius:var(--r-lg);
    color:var(--paper);
    opacity:0; transform:translateY(14px);
    animation:nodeIn .6s var(--ease-smooth) forwards;
    transition:border-color .25s var(--ease-snap), background .25s var(--ease-snap), transform .25s var(--ease-snap), box-shadow .25s var(--ease-snap);
  }
  @keyframes nodeIn{ to{ opacity:1; transform:translateY(0); } }
  .node:hover, .node:focus-visible{
    border-color:var(--bloom);
    background:rgba(241,183,242,.12);
    transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(241,183,242,.18);
  }
  .node-icon{ width:clamp(20px,7vmin,30px); height:clamp(20px,7vmin,30px); stroke:var(--mist); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .node:hover .node-icon, .node:focus-visible .node-icon{ stroke:var(--bloom); }
  .node .node-label{ font-family:'Inter SemiBold'; font-size:clamp(.68rem,2.6vmin,.85rem); }
  .node .node-cat{ font-size:.62rem; color:var(--grey3); text-transform:uppercase; letter-spacing:.06em; }
  @media (max-width:420px){
    .node-cat{ display:none; }
  }

  .stat-strip{
    display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(20px,5vw,56px);
    margin-top:44px; padding-top:28px; border-top:1px solid rgba(214,243,255,.16);
  }
  .stat-strip .stat{ text-align:center; }
  .stat-strip .stat b{ display:block; font-family:'Fira Sans Black'; font-size:1.5rem; }
  .stat-strip .stat span{ font-size:.78rem; color:var(--mist); opacity:.75; }

  /* ---------- detail ---------- */
  #view-detail{ max-width:1080px; margin:0 auto; padding:6px clamp(16px,4vw,40px) 80px; }
  .back-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:1px solid rgba(214,243,255,.3); color:var(--mist);
    padding:9px 16px 9px 12px; border-radius:var(--r-pill); font-family:'Inter SemiBold'; font-size:.85rem;
    transition:background .2s var(--ease-snap), border-color .2s var(--ease-snap);
  }
  .back-btn:hover{ background:rgba(214,243,255,.1); border-color:var(--mist); }
  .back-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

  .detail-topbar{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .present-dots{ display:flex; gap:8px; }
  .present-dots button{
    width:9px; height:9px; padding:0; border-radius:50%;
    border:1px solid rgba(214,243,255,.45); background:transparent;
    transition:background .2s var(--ease-snap), border-color .2s var(--ease-snap), transform .2s var(--ease-snap);
  }
  .present-dots button:hover{ border-color:var(--mist); }
  .present-dots button.active{ background:var(--bloom); border-color:var(--bloom); transform:scale(1.25); }

  .detail-grid{
    display:grid; grid-template-columns:minmax(240px,360px) 1fr; gap:clamp(24px,4vw,56px);
    margin-top:28px;
  }
  @media (max-width:760px){ .detail-grid{ grid-template-columns:1fr; } }

  .hero-stage{
    position:relative; aspect-ratio:1/1; max-width:360px;
    border-radius:var(--r-lg);
    background:radial-gradient(circle at 50% 45%, rgba(214,243,255,.1), rgba(214,243,255,.02) 70%);
    border:1px solid rgba(214,243,255,.2);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .hero-ring{
    position:absolute; inset:12%;
    border:1.5px dashed rgba(214,243,255,.3);
    border-radius:50%;
    animation:spin 22s linear infinite;
  }
  .hero-icon{ width:34%; height:34%; stroke:var(--mist); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; position:relative; z-index:2;
    filter:drop-shadow(0 0 18px rgba(214,243,255,.35)); }
  .hero-icon path, .hero-icon rect, .hero-icon line, .hero-icon circle{
    stroke-dasharray:220; stroke-dashoffset:220; animation:draw 1.4s var(--ease-smooth) forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .hero-extra{ position:absolute; z-index:2; }
  /* ticker */
  .hx-ticker{ display:flex; align-items:flex-end; gap:4px; bottom:16%; right:14%; height:34px; }
  .hx-ticker i{ width:6px; background:var(--bloom); border-radius:3px; opacity:.85; animation:tick 1.6s var(--ease-smooth) infinite; }
  .hx-ticker i:nth-child(1){ height:40%; animation-delay:0s; }
  .hx-ticker i:nth-child(2){ height:75%; animation-delay:.2s; }
  .hx-ticker i:nth-child(3){ height:55%; animation-delay:.4s; }
  @keyframes tick{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(.55); } }
  /* gauge */
  .hx-gauge{ width:14px; height:60px; bottom:15%; right:16%; border:1px solid rgba(214,243,255,.4); border-radius:7px; overflow:hidden; display:flex; align-items:flex-end; }
  .hx-gauge b{ display:block; width:100%; background:var(--bloom); animation:fill 3s var(--ease-smooth) infinite; }
  @keyframes fill{ 0%,100%{ height:30%; } 50%{ height:82%; } }
  /* flow */
  .hx-flow{ top:18%; left:14%; right:14%; height:2px; background:rgba(214,243,255,.25); }
  .hx-flow span{ position:absolute; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--bloom); animation:flow 2.6s var(--ease-smooth) infinite; }
  @keyframes flow{ 0%{ left:0; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ left:calc(100% - 8px); opacity:0; } }
  /* pulse */
  .hx-pulse{ bottom:14%; right:16%; width:26px; height:26px; }
  .hx-pulse i{ position:absolute; inset:0; border:2px solid var(--bloom); border-radius:50%; animation:pulseOut 2.2s var(--ease-smooth) infinite; }
  .hx-pulse i:nth-child(2){ animation-delay:.7s; }
  @keyframes pulseOut{ 0%{ transform:scale(.6); opacity:.9; } 100%{ transform:scale(1.9); opacity:0; } }

  .detail-body .eyebrow{ margin-bottom:10px; display:block; }
  .detail-body h1{ font-size:var(--fs-display); overflow:hidden; }
  .detail-body h1 span{ display:inline-block; animation:riseIn .7s var(--ease-smooth) both; }
  @keyframes riseIn{ from{ transform:translateY(100%); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .detail-sub{ margin-top:16px; font-size:1.05rem; color:var(--mist); opacity:.9; max-width:60ch; }

  .feature-list{ list-style:none; margin:26px 0 0; padding:0; display:flex; flex-direction:column; gap:12px; }
  .feature-list li{ display:flex; gap:12px; align-items:flex-start; font-size:.96rem; }
  .feature-list li::before{
    content:''; flex:0 0 auto; width:8px; height:8px; margin-top:7px; border-radius:50%;
    background:var(--bloom);
  }
  .who-line{ margin-top:24px; padding-top:20px; border-top:1px solid rgba(214,243,255,.16); font-size:.94rem; color:var(--mist); opacity:.85; }
  .note-line{ margin-top:10px; font-size:.86rem; color:var(--grey3); font-style:normal; }

  .proof-tile{
    margin-top:24px; display:inline-flex; flex-direction:column; gap:2px;
    background:rgba(214,243,255,.08); border:1px solid rgba(214,243,255,.22);
    border-radius:var(--r-md); padding:14px 20px;
  }
  .proof-tile b{ font-family:'Fira Sans Black'; font-size:1.6rem; }
  .proof-tile span{ font-size:.78rem; color:var(--mist); opacity:.8; max-width:32ch; }

  .cta-bar{
    margin-top:36px; display:flex; flex-wrap:wrap; align-items:center; gap:16px;
    background:linear-gradient(90deg, rgba(214,243,255,.1), rgba(214,243,255,.02));
    border:1px solid rgba(214,243,255,.2); border-radius:var(--r-lg); padding:20px 24px;
  }
  .cta-bar p{ flex:1 1 220px; font-size:.92rem; color:var(--mist); }
  .cta-btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--mist); color:var(--ink); border:none;
    font-family:'Inter SemiBold'; font-size:.9rem; padding:12px 20px 12px 22px;
    border-radius:var(--r-pill); text-decoration:none;
    transition:background .25s var(--ease-snap), color .25s var(--ease-snap), gap .25s var(--ease-snap);
  }
  .cta-btn svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s var(--ease-snap); }
  .cta-btn:hover{ background:var(--bloom); gap:14px; }
  .cta-btn:hover svg{ transform:translateX(3px); }

  footer.appfoot{ text-align:center; padding:18px; font-size:.72rem; color:var(--grey3); }

  @media (prefers-reduced-motion: reduce){
    .node, .hero-icon path, .hero-icon rect, .hero-icon line, .hero-icon circle, .detail-body h1 span{ animation:none !important; opacity:1 !important; transform:none !important; stroke-dashoffset:0 !important; }
    .hero-ring, .hx-ticker i, .hx-gauge b, .hx-flow span, .hx-pulse i{ animation:none !important; }
  }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand"><a href="../index.html" style="display:flex;align-items:center;"><img src="../logo/wordmark-light.png" alt="munu."></a></div>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" data-lang="no">NO</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main>
    <section id="view-home" class="view active">
      <div class="home-hub">
        <p class="home-tagline" data-t="homeTagline"></p>
        <button type="button" class="present-btn" id="presentBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5 L19 12 L8 19 Z"/></svg>
          <span data-t="presentBtn"></span>
        </button>
      </div>

      <div class="orbit-wrap" id="orbitWrap">
        <div class="orbit-ring"></div>
        <div class="hub"><img src="../logo/wordmark-light.png" alt="munu."></div>
        <div class="nodes" id="nodes"></div>
      </div>

      <div class="stat-strip">
        <div class="stat"><b>1 400+</b><span data-t="stat1"></span></div>
        <div class="stat"><b>4 000+</b><span data-t="stat2"></span></div>
        <div class="stat"><b>50 mill+</b><span data-t="stat3"></span></div>
      </div>
    </section>

    <section id="view-detail" class="view">
      <div class="detail-topbar">
        <button type="button" class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24"><path d="M15 5 L7 12 L15 19"/></svg>
          <span id="backLabel" data-t="back"></span>
        </button>
        <div class="present-dots" id="presentDots" hidden></div>
      </div>

      <div class="detail-grid">
        <div class="hero-stage" id="heroStage"></div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </section>
  </main>

  <footer class="appfoot">munu. &mdash; at your service</footer>
  <div id="wipe" aria-hidden="true"></div>
</div>

  var state = { lang:"no", view:"home" };
  try{
    var savedLang = localStorage.getItem("munu-orbit-lang");
    if(savedLang === "no" || savedLang === "en") state.lang = savedLang;
  }catch(e){}

  var nodesEl = document.getElementById("nodes");
  var orbitWrap = document.getElementById("orbitWrap");
  var wipeEl = document.getElementById("wipe");
  var backBtn = document.getElementById("backBtn");
  var heroStage = document.getElementById("heroStage");
  var detailBody = document.getElementById("detailBody");

  function buildNodes(){
    nodesEl.innerHTML = "";
    PRODUCTS.forEach(function(p, i){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "node";
      btn.style.animationDelay = (i*0.05)+"s";
      btn.dataset.id = p.id;
      btn.innerHTML =
        '<svg class="node-icon"><use href="#'+p.icon+'"/></svg>'+
        '<span class="node-label"></span>'+
        '<span class="node-cat"></span>';
      btn.addEventListener("click", function(){ openProduct(p.id); });
      nodesEl.appendChild(btn);
    });
  }

  function layoutOrbit(){
    var rect = nodesEl.getBoundingClientRect();
    var cx = rect.width/2, cy = rect.height/2;
    var radius = Math.min(rect.width, rect.height)/2 - 6;
    var items = nodesEl.querySelectorAll(".node");
    items.forEach(function(el, i){
      var angle = (i/PRODUCTS.length)*Math.PI*2 - Math.PI/2;
      var x = cx + radius*Math.cos(angle);
      var y = cy + radius*Math.sin(angle);
      el.style.left = (x - el.offsetWidth/2)+"px";
      el.style.top = (y - el.offsetHeight/2)+"px";
    });
  }

  function debounce(fn, ms){
    var t;
    return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
  }

  function renderTexts(){
    var t = UI[state.lang];
    document.querySelectorAll("[data-t]").forEach(function(el){
      var key = el.getAttribute("data-t");
      if(t[key] !== undefined) el.textContent = t[key];
    });
    var nodeEls = nodesEl.querySelectorAll(".node");
    nodeEls.forEach(function(el, i){
      var p = PRODUCTS[i];
      el.querySelector(".node-label").textContent = p[state.lang].short;
      el.querySelector(".node-cat").textContent = p[state.lang].cat;
      el.setAttribute("aria-label", p[state.lang].short);
    });
    document.querySelectorAll(".lang-toggle button").forEach(function(b){
      b.classList.toggle("active", b.dataset.lang === state.lang);
    });
    document.documentElement.lang = state.lang;
    if(state.view === "detail" && state.currentProduct){
      renderDetail(state.currentProduct);
    }
    renderPresentUI();
  }

  function setLang(lang){
    state.lang = lang;
    try{ localStorage.setItem("munu-orbit-lang", lang); }catch(e){}
    renderTexts();
    if(state.presenting){ goToPresentIndex(state.presentIndex); }
  }

  document.querySelectorAll(".lang-toggle button").forEach(function(b){
    b.addEventListener("click", function(){ setLang(b.dataset.lang); });
  });

  function heroExtraMarkup(kind){
    if(kind === "ticker"){ return '<div class="hero-extra hx-ticker"><i></i><i></i><i></i></div>'; }
    if(kind === "gauge"){ return '<div class="hero-extra hx-gauge"><b></b></div>'; }
    if(kind === "flow"){ return '<div class="hero-extra hx-flow"><span></span></div>'; }
    if(kind === "pulse"){ return '<div class="hero-extra hx-pulse"><i></i><i></i></div>'; }
    return "";
  }

  function renderDetail(p){
    var d = p[state.lang];
    heroStage.innerHTML =
      '<div class="hero-ring"></div>'+
      '<svg class="hero-icon" viewBox="0 0 48 48"><use href="#'+p.icon+'"/></svg>'+
      heroExtraMarkup(p.hero);

    var words = d.tag.split(" ");
    var headlineHtml = words.map(function(w, i){
      return '<span style="animation-delay:'+(i*0.05)+'s">'+w+'&nbsp;</span>';
    }).join("");

    var featuresHtml = d.features.map(function(f){ return "<li>"+f+"</li>"; }).join("");

    var proofHtml = d.proof ? (
      '<div class="proof-tile"><b>'+d.proof.value+'</b><span>'+d.proof.label+'</span></div>'
    ) : "";

    var noteHtml = d.note ? '<p class="note-line">'+d.note+'</p>' : "";

    detailBody.innerHTML =
      '<span class="eyebrow">'+d.cat+'</span>'+
      '<h1>'+headlineHtml+'</h1>'+
      '<p class="detail-sub">'+d.sub+'</p>'+
      '<ul class="feature-list">'+featuresHtml+'</ul>'+
      '<p class="who-line">'+d.who+'</p>'+
      noteHtml+
      proofHtml+
      '<div class="cta-bar">'+
        '<p>'+ (state.lang === "no" ? "Klar for å se dette live hos din egen virksomhet?" : "Ready to see this live in your own business?") +'</p>'+
        '<a class="cta-btn" href="https://munu.cloud" target="_blank" rel="noopener">'+d.cta+
          '<svg viewBox="0 0 24 24"><path d="M5 12 H19 M13 6 L19 12 L13 18"/></svg>'+
        '</a>'+
      '</div>';
  }

  function swapView(view, productId){
    document.getElementById("view-home").classList.toggle("active", view === "home");
    document.getElementById("view-detail").classList.toggle("active", view === "detail");
    state.view = view;
    if(view === "detail"){
      state.currentProduct = PRODUCTS.find(function(p){ return p.id === productId; });
      renderDetail(state.currentProduct);
      window.scrollTo(0,0);
    }
  }

  function wipeTo(view, productId){
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced){ swapView(view, productId); return; }
    wipeEl.classList.remove("sweeping");
    void wipeEl.offsetWidth;
    wipeEl.classList.add("sweeping");
    setTimeout(function(){ swapView(view, productId); }, 400);
    setTimeout(function(){ wipeEl.classList.remove("sweeping"); }, 820);
  }

  function openProduct(id){ wipeTo("detail", id); }

  // ---------- presenter mode: auto-advancing narrated walkthrough ----------
  var synth = window.speechSynthesis || null;
  var voices = [];
  function loadVoices(){ voices = synth ? synth.getVoices() : []; }
  if(synth){
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  }
  function pickVoice(lang){
    var prefix = lang === "no" ? "nb" : "en";
    var m = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(prefix) === 0; });
    return m[0] || null;
  }
  function buildNarration(p, lang){
    var d = p[lang];
    var lead = lang === "no" ? "Noen av fordelene: " : "Some of the benefits: ";
    var parts = [d.tag+".", d.sub, lead + d.features.slice(0,4).join(". ") + ".", d.who];
    if(d.note){ parts.push(d.note); }
    if(d.proof){ parts.push(d.proof.value + " " + d.proof.label + "."); }
    return parts.join(" ");
  }

  state.presenting = false;
  state.presentIndex = 0;
  var presentGen = 0;

  function cancelSpeech(){ if(synth) synth.cancel(); }

  function speak(myGen){
    var p = PRODUCTS[state.presentIndex];
    if(!synth){
      setTimeout(function(){ if(myGen === presentGen) autoAdvance(); }, 8000);
      return;
    }
    var utter = new SpeechSynthesisUtterance(buildNarration(p, state.lang));
    utter.lang = state.lang === "no" ? "nb-NO" : "en-US";
    var v = pickVoice(state.lang);
    if(v) utter.voice = v;
    utter.rate = 0.98;
    utter.onend = function(){ if(myGen === presentGen) autoAdvance(); };
    utter.onerror = function(){ if(myGen === presentGen) autoAdvance(); };
    synth.speak(utter);
  }

  function autoAdvance(){
    if(!state.presenting) return;
    if(state.presentIndex >= PRODUCTS.length - 1){
      setTimeout(function(){ if(state.presenting) exitPresentation(); }, 1200);
      return;
    }
    setTimeout(function(){ if(state.presenting) goToPresentIndex(state.presentIndex + 1); }, 1200);
  }

  function goToPresentIndex(i){
    presentGen++;
    var myGen = presentGen;
    state.presentIndex = (i + PRODUCTS.length) % PRODUCTS.length;
    cancelSpeech();
    wipeTo("detail", PRODUCTS[state.presentIndex].id);
    renderPresentUI();
    setTimeout(function(){ if(myGen === presentGen) speak(myGen); }, 450);
  }

  function startPresentation(){
    state.presenting = true;
    goToPresentIndex(0);
  }

  function exitPresentation(){
    state.presenting = false;
    presentGen++;
    cancelSpeech();
    wipeTo("home");
    renderPresentUI();
  }

  function manualStep(delta){
    if(!state.presenting) return;
    goToPresentIndex(state.presentIndex + delta);
  }

  function renderPresentUI(){
    var label = document.getElementById("backLabel");
    var dotsWrap = document.getElementById("presentDots");
    if(!label || !dotsWrap) return;
    if(state.presenting){
      label.textContent = UI[state.lang].exitPresent;
      dotsWrap.hidden = false;
      dotsWrap.innerHTML = PRODUCTS.map(function(p, i){
        return '<button type="button" data-i="'+i+'" class="'+(i === state.presentIndex ? "active" : "")+'" aria-label="'+p[state.lang].short+'"></button>';
      }).join("");
      Array.prototype.forEach.call(dotsWrap.querySelectorAll("button"), function(b){
        b.addEventListener("click", function(){ goToPresentIndex(parseInt(b.dataset.i, 10)); });
      });
    } else {
      label.textContent = UI[state.lang].back;
      dotsWrap.hidden = true;
      dotsWrap.innerHTML = "";
    }
  }

  document.getElementById("presentBtn").addEventListener("click", startPresentation);

  document.addEventListener("keydown", function(e){
    if(!state.presenting) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); manualStep(1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); manualStep(-1); }
    else if(e.key === "Escape"){ exitPresentation(); }
  });

  backBtn.addEventListener("click", function(){
    if(state.presenting){ exitPresentation(); } else { wipeTo("home"); }
  });

  buildNodes();
  renderTexts();
  layoutOrbit();
  window.addEventListener("resize", debounce(layoutOrbit, 150));
})();
</script>
