<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vekstpotensial</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<defs>
  <symbol id="icon-regnskap" viewBox="0 0 48 48">
    <rect x="10" y="8" width="20" height="32" rx="2"/>
    <line x1="14" y1="16" x2="26" y2="16"/><line x1="14" y1="22" x2="26" y2="22"/><line x1="14" y1="28" x2="22" y2="28"/>
    <circle cx="36" cy="14" r="4"/><line x1="32" y1="16" x2="27" y2="20"/>
  </symbol>
  <symbol id="icon-multipay" viewBox="0 0 48 48">
    <rect x="6" y="12" width="36" height="24" rx="4"/>
    <line x1="6" y1="20" x2="42" y2="20"/><rect x="12" y="26" width="8" height="5" rx="1"/>
  </symbol>
  <symbol id="icon-booking" viewBox="0 0 48 48">
    <rect x="8" y="12" width="32" height="28" rx="3"/><line x1="8" y1="20" x2="40" y2="20"/>
    <line x1="16" y1="8" x2="16" y2="14"/><line x1="32" y1="8" x2="32" y2="14"/><path d="M17 29 L22 34 L32 24"/>
  </symbol>
  <symbol id="icon-webshop" viewBox="0 0 48 48">
    <path d="M12 18 L14 12 Q16 8 24 8 Q32 8 34 12 L36 18"/><path d="M9 18 H39 L36 41 H12 Z"/>
    <line x1="17" y1="24" x2="17" y2="30"/><line x1="31" y1="24" x2="31" y2="30"/>
  </symbol>
  <symbol id="icon-kiosk" viewBox="0 0 48 48">
    <rect x="12" y="7" width="24" height="34" rx="4"/><line x1="20" y1="35" x2="28" y2="35"/><path d="M18 22 L23 27 L31 16"/>
  </symbol>
  <symbol id="icon-qr" viewBox="0 0 48 48">
    <rect x="8" y="8" width="12" height="12"/><rect x="28" y="8" width="12" height="12"/><rect x="8" y="28" width="12" height="12"/>
    <rect x="28" y="34" width="6" height="6"/><rect x="34" y="28" width="6" height="6"/>
  </symbol>
</defs>
</svg>

<div id="app">
  <main>
    <div class="page">
      <div class="page-hero">
        <span class="eyebrow" data-i18n="grwEyebrow"></span>
        <h1 data-i18n-html="grwTitleHtml"></h1>
        <p data-i18n="grwSub"></p>
      </div>

      <p class="box-title" style="text-align:center;margin-bottom:14px" data-i18n="grwModuleHint"></p>
      <div class="module-grid" id="moduleGrid">
        <label class="module-card" data-mod="regnskap">
          <input type="checkbox">
          <svg class="module-icon"><use href="#icon-regnskap"/></svg>
          <span class="module-name" data-i18n="grwModRegnskap"></span>
        </label>
        <label class="module-card" data-mod="multipay">
          <input type="checkbox">
          <svg class="module-icon"><use href="#icon-multipay"/></svg>
          <span class="module-name" data-i18n="grwModMultipay"></span>
        </label>
        <label class="module-card" data-mod="booking">
          <input type="checkbox">
          <svg class="module-icon"><use href="#icon-booking"/></svg>
          <span class="module-name" data-i18n="grwModBooking"></span>
        </label>
        <label class="module-card" data-mod="webshop">
          <input type="checkbox">
          <svg class="module-icon"><use href="#icon-webshop"/></svg>
          <span class="module-name" data-i18n="grwModWebshop"></span>
        </label>
        <label class="module-card" data-mod="kiosk">
          <input type="checkbox">
          <svg class="module-icon"><use href="#icon-kiosk"/></svg>
          <span class="module-name" data-i18n="grwModKiosk"></span>
        </label>
        <label class="module-card" data-mod="qr">
          <input type="checkbox">
          <svg class="module-icon"><use href="#icon-qr"/></svg>
          <span class="module-name" data-i18n="grwModQr"></span>
        </label>
      </div>

      <div id="moduleDetails">
        <div class="module-detail" id="detail-regnskap" hidden>
          <div class="split">
            <div class="box">
              <div class="module-detail-head"><h3 data-i18n="grwModRegnskap"></h3></div>
              <div class="field"><label data-i18n="bfyInvisFrekvens"></label><div class="field-input">
                <select id="regn_frekvens">
                  <option value="52" data-i18n="bfyFreqWeek"></option>
                  <option value="12" selected data-i18n="bfyFreqMonth"></option>
                  <option value="4" data-i18n="bfyFreqQuarter"></option>
                </select></div></div>
              <div class="field"><label data-i18n="bfyInvisRegnPris"></label><div class="field-input"><input type="number" id="regn_pris" value="1200"><span class="unit">kr/t</span></div></div>
              <div class="field"><label data-i18n="bfyInvisRegnMin"></label><div class="field-input"><input type="number" id="regn_min" value="45"><span class="unit">min</span></div></div>
              <div class="field"><label data-i18n="bfyInvisStabPris"></label><div class="field-input"><input type="number" id="regn_stabPris" value="450"><span class="unit">kr/t</span></div></div>
              <div class="field"><label data-i18n="bfyInvisStabMin"></label><div class="field-input"><input type="number" id="regn_stabMin" value="90"><span class="unit">min</span></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="resSavings"></div>
              <div id="regn_rows"></div>
              <div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="regn_net"></span></div>
            </div>
          </div>
        </div>

        <div class="module-detail" id="detail-multipay" hidden>
          <div class="split">
            <div class="box">
              <div class="module-detail-head"><h3 data-i18n="grwModMultipay"></h3></div>
              <div class="field"><label data-i18n="grwMpDaily"></label><div class="field-input"><input type="number" id="mp_daily" value="30000"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="grwMpPeakShare"></label><div class="field-input"><input type="number" id="mp_peakShare" value="40"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="grwMpHelgedager"></label><div class="field-input"><input type="number" id="mp_helgedager" value="96"></div></div>
              <div class="range-row">
                <div class="range-row-head"><label data-i18n="grwMpGrowth"></label><span class="range-value" id="mp_growthLabel">30 %</span></div>
                <input type="range" id="mp_growthSlider" min="5" max="60" value="30">
                <div class="range-minmax"><span>5 %</span><span>60 %</span></div>
              </div>
              <div class="field"><label data-i18n="grwMpGrowthCustom"></label><div class="field-input"><input type="number" id="mp_growthCustom" value="30"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="grwMpModulkost"></label><div class="field-input"><input type="number" id="mp_modulkost" value="0"><span class="unit">kr</span></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="grwResPerAr"></div>
              <div id="mp_rows"></div>
              <div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="mp_net"></span></div>
            </div>
          </div>
        </div>

        <div class="module-detail" id="detail-booking" hidden>
          <div class="split">
            <div class="box">
              <div class="module-detail-head"><h3 data-i18n="grwModBooking"></h3></div>
              <div class="field"><label data-i18n="grwBkSnittbord"></label><div class="field-input"><input type="number" id="bk_snittbord" value="850"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="grwBkAntall"></label><div class="field-input"><input type="number" id="bk_antall" value="400"></div></div>
              <div class="field"><label data-i18n="grwBkNoShowFor"></label><div class="field-input"><input type="number" step="0.1" id="bk_noShowFor" value="12"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="grwBkNoShowEtter"></label><div class="field-input"><input type="number" step="0.1" id="bk_noShowEtter" value="4"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="grwBkModulkost"></label><div class="field-input"><input type="number" id="bk_modulkost" value="0"><span class="unit">kr</span></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="resRevenueIncrease"></div>
              <div id="bk_rows"></div>
              <div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="bk_net"></span></div>
            </div>
          </div>
        </div>

        <div class="module-detail" id="detail-webshop" hidden>
          <div class="split">
            <div class="box">
              <div class="module-detail-head"><h3 data-i18n="grwModWebshop"></h3></div>
              <div class="field"><label data-i18n="grwWsEkstraOms"></label><div class="field-input"><input type="number" id="ws_ekstraOms" value="60000"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="grwWsMargin"></label><div class="field-input"><input type="number" id="ws_margin" value="65"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="grwWsDrift"></label><div class="field-input"><input type="number" id="ws_drift" value="2500"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="grwWsTrans"></label><div class="field-input"><input type="number" step="0.01" id="ws_trans" value="1.75"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="grwWsModulkost"></label><div class="field-input"><input type="number" id="ws_modulkost" value="0"><span class="unit">kr</span></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="resRevenueIncrease"></div>
              <div id="ws_rows"></div>
              <div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="ws_net"></span></div>
            </div>
          </div>
        </div>

        <div class="module-detail" id="detail-kiosk" hidden>
          <div class="split">
            <div class="box">
              <div class="module-detail-head"><h3 data-i18n="grwModKiosk"></h3></div>
              <div class="field"><label data-i18n="grwKiArsverk"></label><div class="field-input"><input type="number" step="0.1" id="ki_arsverk" value="1"></div></div>
              <div class="field"><label data-i18n="grwKiLonn"></label><div class="field-input"><input type="number" id="ki_lonn" value="420000"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="grwKiModulkost"></label><div class="field-input"><input type="number" id="ki_modulkost" value="0"><span class="unit">kr</span></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="resSavings"></div>
              <div id="ki_rows"></div>
              <div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="ki_net"></span></div>
            </div>
          </div>
        </div>

        <div class="module-detail" id="detail-qr" hidden>
          <div class="split">
            <div class="box">
              <div class="module-detail-head"><h3 data-i18n="grwModQr"></h3></div>
              <div class="field"><label data-i18n="grwQrSnittordreFor"></label><div class="field-input"><input type="number" id="qr_snittordre" value="280"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="grwQrOkning"></label><div class="field-input"><input type="number" id="qr_okning" value="15"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="grwQrAntallOrdrer"></label><div class="field-input"><input type="number" id="qr_antallOrdrer" value="750"></div></div>
              <div class="field"><label data-i18n="grwQrBemanningskutt"></label><div class="field-input"><input type="number" step="0.1" id="qr_bemanning" value="0"></div></div>
              <div class="field"><label data-i18n="grwKiLonn"></label><div class="field-input"><input type="number" id="qr_lonn" value="420000"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="grwQrModulkost"></label><div class="field-input"><input type="number" id="qr_modulkost" value="0"><span class="unit">kr</span></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="resRevenueIncrease"></div>
              <div id="qr_rows"></div>
              <div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="qr_net"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="appfoot">munu. &mdash; at your service</footer>
</div>

<script src="../shared/i18n.js"></script>
<script src="../shared/state.js"></script>
<script src="../shared/header.js"></script>
<script>
(function(){
  "use strict";

  window.MunuHeader.inject({ logoSrc:"../logo/wordmark-light.png", homeHref:"../index.html", back:"index.html", backKey:"hdrBackToMenu" });
  window.MunuState.initFloatingPanel();

  var num = function(id){ var el = document.getElementById(id); var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };
  var fmt = function(n){ return window.MunuState.formatKr(n); };
  var t = function(key){ return window.MunuI18n.t(key); };

  var LABELS = {
    regnskap:{ no:"Regnskapsintegrasjon", en:"Accounting integration" },
    multipay:{ no:"Multipay", en:"Multipay" },
    booking:{ no:"Booking", en:"Booking" },
    webshop:{ no:"Nettbutikk", en:"Webshop" },
    kiosk:{ no:"Kiosk", en:"Kiosk" },
    qr:{ no:"Selvbetjent QR", en:"Self-service QR" }
  };

  function row(labelKey, value, cls){
    return '<div class="result-row"><span>'+t(labelKey)+'</span><span class="amount'+(cls?" "+cls:"")+'">'+fmt(value)+'</span></div>';
  }

  function renderRegnskap(){
    var freq = num("regn_frekvens");
    var regnKost = num("regn_pris") * (num("regn_min")/60) * freq;
    var stabKost = num("regn_stabPris") * (num("regn_stabMin")/60) * 52;
    var net = regnKost + stabKost;
    document.getElementById("regn_rows").innerHTML =
      row("bfyResRegnKost", regnKost) + row("bfyResStabKost", stabKost);
    document.getElementById("regn_net").textContent = fmt(net);
    return { annualSavings:net, annualRevenueIncrease:0, annualNetResult:net };
  }

  function renderMultipay(){
    var daily = num("mp_daily"), peakShare = num("mp_peakShare"), helgedager = num("mp_helgedager");
    var growth = num("mp_growthCustom");
    var peakDaily = daily * (peakShare/100);
    var perHelgedag = peakDaily * (growth/100);
    var perHelg = perHelgedag * 2;
    var perMnd = helgedager > 0 ? perHelgedag * (helgedager/12) : 0;
    var perAr = perHelgedag * helgedager;
    var vekstProsent = (daily > 0 && helgedager > 0) ? (perAr / (daily * helgedager)) * 100 : 0;
    var modulkost = num("mp_modulkost");
    var net = perAr - modulkost * 12;
    document.getElementById("mp_rows").innerHTML =
      row("grwResPerHelgedag", perHelgedag) + row("grwResPerHelg", perHelg) +
      row("grwResPerMnd", perMnd) + row("grwResPerAr", perAr) +
      '<div class="result-row"><span>'+t("grwResVekstProsent")+'</span><span class="amount">'+vekstProsent.toFixed(1)+' %</span></div>' +
      row("resModuleCost", modulkost * 12);
    document.getElementById("mp_net").textContent = fmt(net);
    return { annualSavings:0, annualRevenueIncrease:perAr, annualNetResult:net };
  }

  function renderBooking(){
    var reddetMnd = num("bk_snittbord") * num("bk_antall") * ((num("bk_noShowFor") - num("bk_noShowEtter"))/100);
    var revenueIncrease = reddetMnd * 12;
    var modulkost = num("bk_modulkost");
    var net = revenueIncrease - modulkost * 12;
    document.getElementById("bk_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) + row("resModuleCost", modulkost * 12);
    document.getElementById("bk_net").textContent = fmt(net);
    return { annualSavings:0, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  function renderWebshop(){
    var revenueIncrease = num("ws_ekstraOms") * 12;
    var bruttoresultat = revenueIncrease * (num("ws_margin")/100);
    var driftAr = num("ws_drift") * 12;
    var transKostAr = revenueIncrease * (num("ws_trans")/100);
    var modulkostAr = num("ws_modulkost") * 12;
    var net = bruttoresultat - driftAr - transKostAr - modulkostAr;
    document.getElementById("ws_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) +
      '<div class="result-row"><span>'+t("grwWsMargin")+'</span><span class="amount">'+fmt(bruttoresultat)+'</span></div>' +
      row("grwWsDrift", driftAr) +
      '<div class="result-row"><span>'+t("grwWsTrans")+'</span><span class="amount negative">-'+fmt(transKostAr)+'</span></div>' +
      row("resModuleCost", modulkostAr);
    document.getElementById("ws_net").textContent = fmt(net);
    return { annualSavings:0, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  function renderKiosk(){
    var savings = num("ki_arsverk") * num("ki_lonn");
    var modulkost = num("ki_modulkost");
    var net = savings - modulkost * 12;
    document.getElementById("ki_rows").innerHTML =
      row("resSavings", savings) + row("resModuleCost", modulkost * 12);
    document.getElementById("ki_net").textContent = fmt(net);
    return { annualSavings:savings, annualRevenueIncrease:0, annualNetResult:net };
  }

  function renderQr(){
    var ekstraOmsMnd = num("qr_snittordre") * (num("qr_okning")/100) * num("qr_antallOrdrer");
    var revenueIncrease = ekstraOmsMnd * 12;
    var bemanningsgevinst = num("qr_bemanning") * num("qr_lonn");
    var modulkost = num("qr_modulkost");
    var net = revenueIncrease + bemanningsgevinst - modulkost * 12;
    document.getElementById("qr_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) +
      '<div class="result-row"><span>'+t("grwQrBemanningskutt")+'</span><span class="amount">'+fmt(bemanningsgevinst)+'</span></div>' +
      row("resModuleCost", modulkost * 12);
    document.getElementById("qr_net").textContent = fmt(net);
    return { annualSavings:bemanningsgevinst, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  var RENDERERS = { regnskap:renderRegnskap, multipay:renderMultipay, booking:renderBooking, webshop:renderWebshop, kiosk:renderKiosk, qr:renderQr };
  var MODS = Object.keys(RENDERERS);

  function syncModule(mod){
    var result = RENDERERS[mod]();
    var card = document.querySelector('.module-card[data-mod="'+mod+'"]');
    var checked = card.querySelector("input[type=checkbox]").checked;
    document.getElementById("detail-" + mod).hidden = !checked;
    card.classList.toggle("on", checked);
    if(checked){
      window.MunuState.setCalculator("grw-" + mod, {
        label: LABELS[mod],
        annualSavings: result.annualSavings,
        annualRevenueIncrease: result.annualRevenueIncrease,
        annualNetResult: result.annualNetResult,
        includedInTotal: true
      });
    } else {
      window.MunuState.clearCalculator("grw-" + mod);
    }
  }

  function renderAll(){ MODS.forEach(syncModule); }

  document.querySelectorAll(".module-card input[type=checkbox]").forEach(function(cb){
    cb.addEventListener("change", function(){
      var mod = cb.closest(".module-card").dataset.mod;
      syncModule(mod);
    });
  });

  document.querySelectorAll(".module-detail input, .module-detail select").forEach(function(el){
    el.addEventListener("input", function(){
      var mod = el.closest(".module-detail").id.replace("detail-", "");
      syncModule(mod);
    });
    el.addEventListener("change", function(){
      var mod = el.closest(".module-detail").id.replace("detail-", "");
      syncModule(mod);
    });
  });

  var mpSlider = document.getElementById("mp_growthSlider");
  var mpCustom = document.getElementById("mp_growthCustom");
  var mpLabel = document.getElementById("mp_growthLabel");
  mpSlider.addEventListener("input", function(){
    mpCustom.value = mpSlider.value;
    mpLabel.textContent = mpSlider.value + " %";
    syncModule("multipay");
  });
  mpCustom.addEventListener("input", function(){
    var v = parseFloat(mpCustom.value) || 0;
    mpLabel.textContent = v + " %";
    if(v >= 5 && v <= 60){ mpSlider.value = v; }
    syncModule("multipay");
  });

  document.addEventListener("munu:langchange", renderAll);

  renderAll();
})();
</script>
</body>
</html>
