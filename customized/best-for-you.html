<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Er Munu best for deg?</title>
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div id="app">
  <main>
    <div class="page">
      <div class="page-hero">
        <span class="eyebrow" data-i18n="bfyEyebrow"></span>
        <h1 data-i18n-html="bfyTitleHtml"></h1>
        <p data-i18n="bfySub"></p>
      </div>

      <div class="split split-rev">
        <div>
          <div class="tabs" id="tabs">
            <button type="button" class="tab-btn" data-tab="trans">
              <span data-i18n="bfyTabTransTitle"></span>
              <span class="tab-sub" data-i18n="bfyTabTransSub"></span>
            </button>
            <button type="button" class="tab-btn" data-tab="invis">
              <span data-i18n="bfyTabInvisTitle"></span>
              <span class="tab-sub" data-i18n="bfyTabInvisSub"></span>
            </button>
            <button type="button" class="tab-btn" data-tab="down">
              <span data-i18n="bfyTabDownTitle"></span>
              <span class="tab-sub" data-i18n="bfyTabDownSub"></span>
            </button>
          </div>

          <div class="tab-panel" id="panel-trans">
            <div class="box">
              <div class="box-title" data-i18n="bfyTransOmsetning"></div>
              <div class="field"><label data-i18n="bfyTransOmsetning"></label><div class="field-input"><input type="number" id="t_omsetning" value="20019000"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="bfyTransAntall"></label><div class="field-input"><input type="number" id="t_antall" value="7000"></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="bfyTransKonkHead"></div>
              <div class="field"><label data-i18n="bfyTransKonkProsent"></label><div class="field-input"><input type="number" step="0.01" id="t_konkProsent" value="1.75"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="bfyTransKonkLisens"></label><div class="field-input"><input type="number" id="t_konkLisens" value="275"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="bfyTransKonkHw"></label><div class="field-input"><input type="number" id="t_konkHw" value="0"><span class="unit">kr</span></div></div>
            </div>
            <div class="box">
              <div class="box-title" data-i18n="bfyTransMunuHead"></div>
              <div class="field"><label data-i18n="bfyTransMunuProsent"></label><div class="field-input"><input type="number" step="0.01" id="t_munuProsent" value="0.55"><span class="unit">%</span></div></div>
              <div class="preset-row" id="tierPresets">
                <button type="button" class="preset-btn active" data-value="0.55">IC++ 0.55%</button>
                <button type="button" class="preset-btn" data-value="0.60">Tier 8 0.60%</button>
                <button type="button" class="preset-btn" data-value="0.70">Tier 1 0.70%</button>
              </div>
              <div class="field"><label data-i18n="bfyTransMunuBehandling"></label><div class="field-input"><input type="number" step="0.01" id="t_munuBehandling" value="0.40"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="bfyTransMunuLisens"></label><div class="field-input"><input type="number" id="t_munuLisens" value="2005"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="bfyTransMunuHw"></label><div class="field-input"><input type="number" id="t_munuHw" value="936"><span class="unit">kr</span></div></div>
            </div>
          </div>

          <div class="tab-panel" id="panel-invis">
            <div class="box">
              <div class="field">
                <label data-i18n="bfyInvisFrekvens"></label>
                <div class="field-input">
                  <select id="i_frekvens">
                    <option value="52" data-i18n="bfyFreqWeek"></option>
                    <option value="12" selected data-i18n="bfyFreqMonth"></option>
                    <option value="4" data-i18n="bfyFreqQuarter"></option>
                  </select>
                </div>
              </div>
              <div class="field"><label data-i18n="bfyInvisRegnPris"></label><div class="field-input"><input type="number" id="i_regnPris" value="1200"><span class="unit">kr/t</span></div></div>
              <div class="field"><label data-i18n="bfyInvisRegnMin"></label><div class="field-input"><input type="number" id="i_regnMin" value="45"><span class="unit">min</span></div></div>
              <div class="field"><label data-i18n="bfyInvisStabPris"></label><div class="field-input"><input type="number" id="i_stabPris" value="450"><span class="unit">kr/t</span></div></div>
              <div class="field"><label data-i18n="bfyInvisStabMin"></label><div class="field-input"><input type="number" id="i_stabMin" value="90"><span class="unit">min</span></div></div>
            </div>
          </div>

          <div class="tab-panel" id="panel-down">
            <div class="box">
              <div class="field"><label data-i18n="bfyDownOmsetningTime"></label><div class="field-input"><input type="number" id="d_omsTime" value="15000"><span class="unit">kr</span></div></div>
              <div class="field"><label data-i18n="bfyDownVarighet"></label><div class="field-input"><input type="number" step="0.1" id="d_varighet" value="2"><span class="unit">t</span></div></div>
              <div class="field"><label data-i18n="bfyDownTapsandel"></label><div class="field-input"><input type="number" id="d_tapsandel" value="70"><span class="unit">%</span></div></div>
              <div class="field"><label data-i18n="bfyDownHendelserKonk"></label><div class="field-input"><input type="number" id="d_hendKonk" value="12"></div></div>
              <div class="field"><label data-i18n="bfyDownHendelserMunu"></label><div class="field-input"><input type="number" id="d_hendMunu" value="2"></div></div>
            </div>
          </div>
        </div>

        <div class="sticky-col">
          <div class="box">
            <div class="box-title" id="resultTitle"></div>
            <div id="resultRows"></div>
            <div class="result-total"><span data-i18n="bfyResSavings"></span><span class="amount" id="resultTotal"></span></div>
            <label class="check-row"><input type="checkbox" id="includeToggle"><span data-i18n="bfyInclude"></span></label>
          </div>
          <div class="box">
            <p style="font-size:.9rem;color:var(--mist);opacity:.85" data-i18n="bfyCtaLine"></p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="appfoot">munu. &mdash; at your service</footer>
</div>

<script src="../shared/i18n.js"></script>
<script src="../shared/state.js"></script>
<script src="../shared/header.js"></script>
<script>
(function(){
  "use strict";

  window.MunuHeader.inject({ logoSrc:"../logo/wordmark-light.png", homeHref:"../index.html", back:"index.html", backKey:"hdrBackToMenu" });
  window.MunuState.initFloatingPanel();

  var num = function(id){ var el = document.getElementById(id); var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };

  var TABS = ["trans","invis","down"];
  var LABELS = {
    trans:{ no:"Transaksjonskostnad", en:"Transaction cost" },
    invis:{ no:"Usynlige kostnader", en:"Hidden costs" },
    down:{ no:"Nedetid", en:"Downtime" }
  };
  var included = { trans:false, invis:false, down:false };
  var activeTab = "trans";

  function computeTrans(){
    var omsetning = num("t_omsetning"), antall = num("t_antall");
    var konkKost = omsetning * (num("t_konkProsent")/100) + (num("t_konkLisens") + num("t_konkHw")) * 12;
    var munuKost = omsetning * (num("t_munuProsent")/100) + antall * num("t_munuBehandling") + (num("t_munuLisens") + num("t_munuHw")) * 12;
    var savings = konkKost - munuKost;
    return {
      rows:[
        { key:"bfyResKonkKost", value:konkKost },
        { key:"bfyResMunuKost", value:munuKost }
      ],
      savings:savings
    };
  }

  function computeInvis(){
    var freq = num("i_frekvens");
    var regnKost = num("i_regnPris") * (num("i_regnMin")/60) * freq;
    var stabKost = num("i_stabPris") * (num("i_stabMin")/60) * 52;
    return {
      rows:[
        { key:"bfyResRegnKost", value:regnKost },
        { key:"bfyResStabKost", value:stabKost }
      ],
      savings:regnKost + stabKost
    };
  }

  function computeDown(){
    var kostPerHendelse = num("d_omsTime") * num("d_varighet") * (num("d_tapsandel")/100);
    var savings = kostPerHendelse * (num("d_hendKonk") - num("d_hendMunu"));
    return {
      rows:[
        { key:"bfyResKostPerHendelse", value:kostPerHendelse }
      ],
      savings:savings
    };
  }

  var COMPUTE = { trans:computeTrans, invis:computeInvis, down:computeDown };

  function render(){
    var t = window.MunuI18n.t;
    var lang = window.MunuI18n.getLang();
    var result = COMPUTE[activeTab]();

    document.getElementById("resultTitle").textContent = t("bfyTab" + (activeTab === "trans" ? "Trans" : activeTab === "invis" ? "Invis" : "Down") + "Title");
    document.getElementById("resultRows").innerHTML = result.rows.map(function(r){
      return '<div class="result-row"><span>'+t(r.key)+'</span><span class="amount">'+window.MunuState.formatKr(r.value)+'</span></div>';
    }).join("");
    document.getElementById("resultTotal").textContent = window.MunuState.formatKr(result.savings);
    document.getElementById("includeToggle").checked = included[activeTab];

    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.tab === activeTab); });
    document.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.toggle("active", p.id === "panel-" + activeTab); });

    if(included[activeTab]){
      window.MunuState.setCalculator("bfy-" + activeTab, {
        label: LABELS[activeTab],
        annualSavings: result.savings,
        annualRevenueIncrease: 0,
        annualNetResult: result.savings,
        includedInTotal: true
      });
    }
  }

  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.addEventListener("click", function(){ activeTab = b.dataset.tab; render(); });
  });

  document.getElementById("includeToggle").addEventListener("change", function(e){
    included[activeTab] = e.target.checked;
    var result = COMPUTE[activeTab]();
    window.MunuState.setCalculator("bfy-" + activeTab, {
      label: LABELS[activeTab],
      annualSavings: result.savings,
      annualRevenueIncrease: 0,
      annualNetResult: result.savings,
      includedInTotal: included[activeTab]
    });
    render();
  });

  document.querySelectorAll(".tab-panel input, .tab-panel select").forEach(function(el){
    el.addEventListener("input", render);
    el.addEventListener("change", render);
  });

  document.querySelectorAll("#tierPresets .preset-btn").forEach(function(b){
    b.addEventListener("click", function(){
      document.getElementById("t_munuProsent").value = b.dataset.value;
      document.querySelectorAll("#tierPresets .preset-btn").forEach(function(x){ x.classList.toggle("active", x === b); });
      render();
    });
  });

  document.addEventListener("munu:langchange", render);

  render();
})();
</script>
</body>
</html>
