<script src="../shared/i18n.js"></script>
<script src="../shared/state.js"></script>
<script src="../shared/header.js"></script>
<script>
(function(){
  "use strict";

  window.MunuHeader.inject({ logoSrc:"../logo/wordmark-light.png", homeHref:"../index.html", back:"../index.html" });

  var num = function(id){ var el = document.getElementById(id); var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };
  var fmt = function(n){ return window.MunuState.formatKr(n); };
  var t = function(key){ return window.MunuI18n.t(key); };

  function row(labelKey, value, cls){
    return '<div class="result-row"><span>'+t(labelKey)+'</span><span class="amount'+(cls?" "+cls:"")+'">'+fmt(value)+'</span></div>';
  }

  function setAmount(el, value){
    el.textContent = fmt(value);
    el.classList.toggle("negative", value < 0);
  }

  function updateGrandTotal(){
    setAmount(document.getElementById("grandTotal"), window.MunuState.totalNet());
  }

  // ---------- transaction cost (always included) ----------
  // Omsetning, antall transaksjoner and kostnad per transaksjon are kept in sync:
  // editing antall or kostnad recalculates omsetning; editing omsetning recalculates kostnad.
  var tOmsetning = document.getElementById("t_omsetning");
  var tAntall = document.getElementById("t_antall");
  var tKostPerTrans = document.getElementById("t_kostPerTrans");

  function syncOmsetningFromAntallKost(){
    var antall = num("t_antall"), kost = num("t_kostPerTrans");
    tOmsetning.value = Math.round(antall * kost);
  }
  function syncKostFromOmsetning(){
    var antall = num("t_antall"), oms = num("t_omsetning");
    tKostPerTrans.value = antall > 0 ? +(oms / antall).toFixed(2) : 0;
  }

  function renderTrans(){
    var antall = num("t_antall");
    var omsetning = num("t_omsetning");
    var konkKost = omsetning * (num("t_konkProsent")/100) + antall * num("t_konkBehandling") + (num("t_konkLisens") + num("t_konkHw")) * 12;
    var munuKost = omsetning * (num("t_munuProsent")/100) + antall * num("t_munuBehandling") + (num("t_munuLisens") + num("t_munuHw")) * 12;
    var savings = konkKost - munuKost;

    document.getElementById("trans_rows").innerHTML =
      row("bfyResKonkKost", konkKost) + row("bfyResMunuKost", munuKost);
    setAmount(document.getElementById("trans_savings"), savings);

    window.MunuState.setCalculator("calc-trans", {
      label:{ no:"Transaksjonskostnad", en:"Transaction cost" },
      annualSavings:savings, annualRevenueIncrease:0, annualNetResult:savings, includedInTotal:true
    });
    updateGrandTotal();
  }

  tAntall.addEventListener("input", function(){ syncOmsetningFromAntallKost(); renderTrans(); });
  tKostPerTrans.addEventListener("input", function(){ syncOmsetningFromAntallKost(); renderTrans(); });
  tOmsetning.addEventListener("input", function(){ syncKostFromOmsetning(); renderTrans(); });

  document.querySelectorAll('.split.split-rev input').forEach(function(el){
    if(el === tOmsetning || el === tAntall || el === tKostPerTrans) return;
    el.addEventListener("input", renderTrans);
  });
  document.querySelectorAll("#tierPresets .preset-btn").forEach(function(b){
    b.addEventListener("click", function(){
      document.getElementById("t_munuProsent").value = b.dataset.value;
      document.querySelectorAll("#tierPresets .preset-btn").forEach(function(x){ x.classList.toggle("active", x === b); });
      renderTrans();
    });
  });

  // ---------- growth / savings modules (toggle-able) ----------
  var LABELS = {
    regnskap:{ no:"Regnskapsintegrasjon", en:"Accounting integration" },
    multipay:{ no:"Multipay", en:"Multipay" },
    booking:{ no:"Booking", en:"Booking" },
    webshop:{ no:"Webshop Takeaway", en:"Webshop Takeaway" },
    kiosk:{ no:"Kiosk", en:"Kiosk" },
    qr:{ no:"Selvbetjent QR", en:"Self-service QR" }
  };

  function renderRegnskap(){
    var freq = num("regn_frekvens");
    var regnKost = num("regn_pris") * (num("regn_min")/60) * freq;
    var stabKost = num("regn_stabPris") * (num("regn_stabMin")/60) * 52;
    var modulkostAr = num("regn_modulkost") * 12;
    var setup = num("regn_setup");
    var net = regnKost + stabKost - modulkostAr - setup;
    document.getElementById("regn_rows").innerHTML =
      row("bfyResRegnKost", regnKost) + row("bfyResStabKost", stabKost) +
      row("grwRegnModulkost", modulkostAr, "negative") + row("grwRegnSetup", setup, "negative");
    setAmount(document.getElementById("regn_net"), net);
    return { annualSavings:regnKost + stabKost, annualRevenueIncrease:0, annualNetResult:net };
  }

  function renderMultipay(){
    var daily = num("mp_daily"), peakShare = num("mp_peakShare"), helgedager = num("mp_helgedager");
    var growth = num("mp_growthCustom");
    var peakDaily = daily * (peakShare/100);
    var perHelgedag = peakDaily * (growth/100);
    var perHelg = perHelgedag * 2;
    var perMnd = helgedager > 0 ? perHelgedag * (helgedager/12) : 0;
    var perAr = perHelgedag * helgedager;
    var vekstProsent = (daily > 0 && helgedager > 0) ? (perAr / (daily * helgedager)) * 100 : 0;
    var modulkost = num("mp_modulkost");
    var net = perAr - modulkost * 12;
    document.getElementById("mp_rows").innerHTML =
      row("grwResPerHelgedag", perHelgedag) + row("grwResPerHelg", perHelg) +
      row("grwResPerMnd", perMnd) + row("grwResPerAr", perAr) +
      '<div class="result-row"><span>'+t("grwResVekstProsent")+'</span><span class="amount">'+vekstProsent.toFixed(1)+' %</span></div>' +
      row("resModuleCost", modulkost * 12);
    setAmount(document.getElementById("mp_net"), net);
    return { annualSavings:0, annualRevenueIncrease:perAr, annualNetResult:net };
  }

  function renderBooking(){
    var reddetMnd = num("bk_snittbord") * num("bk_antall") * ((num("bk_noShowFor") - num("bk_noShowEtter"))/100);
    var revenueIncrease = reddetMnd * 12;
    var modulkost = num("bk_modulkost");
    var net = revenueIncrease - modulkost * 12;
    document.getElementById("bk_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) + row("resModuleCost", modulkost * 12);
    setAmount(document.getElementById("bk_net"), net);
    return { annualSavings:0, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  function renderWebshop(){
    var revenueIncrease = num("ws_ekstraOms") * 12;
    var bruttoresultat = revenueIncrease * (num("ws_margin")/100);
    var driftAr = num("ws_drift") * 12;
    var transKostAr = revenueIncrease * (num("ws_trans")/100);
    var modulkostAr = num("ws_modulkost") * 12;
    var net = bruttoresultat - driftAr - transKostAr - modulkostAr;
    document.getElementById("ws_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) +
      '<div class="result-row"><span>'+t("grwWsMargin")+'</span><span class="amount">'+fmt(bruttoresultat)+'</span></div>' +
      row("grwWsDrift", driftAr) +
      '<div class="result-row"><span>'+t("grwWsTrans")+'</span><span class="amount negative">-'+fmt(transKostAr)+'</span></div>' +
      row("resModuleCost", modulkostAr);
    setAmount(document.getElementById("ws_net"), net);
    return { annualSavings:0, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  function renderKiosk(){
    var savings = num("ki_arsverk") * num("ki_lonn");
    var modulkost = num("ki_modulkost");
    var net = savings - modulkost * 12;
    document.getElementById("ki_rows").innerHTML =
      row("resSavings", savings) + row("resModuleCost", modulkost * 12);
    setAmount(document.getElementById("ki_net"), net);
    return { annualSavings:savings, annualRevenueIncrease:0, annualNetResult:net };
  }

  function renderQr(){
    var ekstraOmsMnd = num("qr_snittordre") * (num("qr_okning")/100) * num("qr_antallOrdrer");
    var revenueIncrease = ekstraOmsMnd * 12;
    var bemanningsgevinst = num("qr_bemanning") * num("qr_lonn");
    var modulkost = num("qr_modulkost");
    var net = revenueIncrease + bemanningsgevinst - modulkost * 12;
    document.getElementById("qr_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) +
      '<div class="result-row"><span>'+t("grwQrBemanningskutt")+'</span><span class="amount">'+fmt(bemanningsgevinst)+'</span></div>' +
      row("resModuleCost", modulkost * 12);
    setAmount(document.getElementById("qr_net"), net);
    return { annualSavings:bemanningsgevinst, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  var RENDERERS = { regnskap:renderRegnskap, multipay:renderMultipay, booking:renderBooking, webshop:renderWebshop, kiosk:renderKiosk, qr:renderQr };
  var MODS = Object.keys(RENDERERS);

  function syncModule(mod){
    var result = RENDERERS[mod]();
    var card = document.querySelector('.module-card[data-mod="'+mod+'"]');
    var checked = card.querySelector("input[type=checkbox]").checked;
    document.getElementById("detail-" + mod).hidden = !checked;
    card.classList.toggle("on", checked);
    if(checked){
      window.MunuState.setCalculator("calc-" + mod, {
        label: LABELS[mod],
        annualSavings: result.annualSavings,
        annualRevenueIncrease: result.annualRevenueIncrease,
        annualNetResult: result.annualNetResult,
        includedInTotal: true
      });
    } else {
      window.MunuState.clearCalculator("calc-" + mod);
    }
    updateGrandTotal();
  }

  function renderAllModules(){ MODS.forEach(syncModule); }

  document.querySelectorAll(".module-card input[type=checkbox]").forEach(function(cb){
    cb.addEventListener("change", function(){
      syncModule(cb.closest(".module-card").dataset.mod);
    });
  });

  document.querySelectorAll(".module-detail input, .module-detail select").forEach(function(el){
    var handler = function(){ syncModule(el.closest(".module-detail").id.replace("detail-", "")); };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  var mpSlider = document.getElementById("mp_growthSlider");
  var mpCustom = document.getElementById("mp_growthCustom");
  var mpLabel = document.getElementById("mp_growthLabel");
  mpSlider.addEventListener("input", function(){
    mpCustom.value = mpSlider.value;
    mpLabel.textContent = mpSlider.value + " %";
    syncModule("multipay");
  });
  mpCustom.addEventListener("input", function(){
    var v = parseFloat(mpCustom.value) || 0;
    mpLabel.textContent = v + " %";
    if(v >= 5 && v <= 60){ mpSlider.value = v; }
    syncModule("multipay");
  });

  document.addEventListener("munu:langchange", function(){ renderTrans(); renderAllModules(); });

  renderTrans();
  renderAllModules();
})();
</script>
</body>
</html>
