<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the leak</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .orbit-wrap{ position:relative; width:min(74vmin,430px); height:min(74vmin,430px); margin:24px auto 8px; }
  .orbit-ring{ position:absolute; inset:8%; border:1px dashed rgba(214,243,255,.22); border-radius:50%; }
  .hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:clamp(84px,15vmin,124px); height:clamp(84px,15vmin,124px); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(214,243,255,.22), rgba(214,243,255,.03) 60%), rgba(214,243,255,.06);
    border:1px solid rgba(214,243,255,.3); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 60px rgba(214,243,255,.15); z-index:2;
  }
  .hub img{ width:58%; height:auto; }
  .nodes{ position:absolute; inset:0; z-index:3; }
  .node{
    position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px;
    width:clamp(74px,17vmin,110px); padding:12px 6px 10px; text-align:center;
    background:rgba(0,7,67,.6); border:1px solid rgba(214,243,255,.28); border-radius:var(--r-lg); color:var(--paper);
    transition:border-color .25s var(--ease-snap), background .25s var(--ease-snap), transform .25s var(--ease-snap), box-shadow .25s var(--ease-snap);
  }
  .node:hover, .node:focus-visible{ border-color:var(--bloom); background:rgba(241,183,242,.12); transform:translateY(-4px); box-shadow:0 10px 30px rgba(241,183,242,.18); }
  .node.included{ border-color:var(--green); }
  .node-icon{ width:22px; height:22px; stroke:var(--mist); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .node:hover .node-icon{ stroke:var(--bloom); }
  .node-label{ font-family:'Inter SemiBold'; font-size:.76rem; }
  .node-amount{ font-size:.66rem; color:var(--green); font-family:'Inter SemiBold'; min-height:.9em; }

  #wipe{ position:fixed; inset:0; z-index:60; background:var(--mist); transform:translateX(-100%); pointer-events:none; }
  @keyframes wipeSweep{ 0%{ transform:translateX(-100%); } 50%{ transform:translateX(0); } 100%{ transform:translateX(100%); } }
  #wipe.sweeping{ animation:wipeSweep .7s var(--ease-smooth); }

  .view{ display:none; }
  .view.active{ display:block; }

  .detail-topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .detail-total{ background:rgba(0,132,71,.1); border:1px solid rgba(0,132,71,.4); border-radius:var(--r-pill); padding:8px 18px; display:flex; align-items:center; gap:10px; font-size:.8rem; }
  .detail-total .amount{ font-family:'Fira Sans Black'; font-size:1rem; color:var(--green); }
  .detail-total .amount.negative{ color:var(--red); }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:680px){ .two-col{ grid-template-columns:1fr; } }

  .field.has-slider{ border-bottom:none; padding-bottom:2px; }
  .mini-slider-wrap{ padding:0 0 10px; border-bottom:1px solid rgba(214,243,255,.14); }
  .mini-slider{ -webkit-appearance:none; appearance:none; width:100%; height:3px; border-radius:999px; background:rgba(214,243,255,.18); outline:none; display:block; cursor:pointer; }
  .mini-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:12px; margin-top:-4.5px; border-radius:50%; background:var(--mist); border:2px solid var(--ink); cursor:pointer; }
  .mini-slider::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background:var(--mist); border:2px solid var(--ink); cursor:pointer; border:none; }
  .mini-slider::-moz-range-track{ height:3px; border-radius:999px; background:rgba(214,243,255,.18); }

  .note-line{ margin-top:8px; font-size:.78rem; color:var(--grey3); }

  .hw-head{ display:flex; justify-content:flex-end; gap:8px; padding:0 0 6px; }
  .hw-head span{ font-size:.66rem; color:var(--grey3); text-transform:uppercase; letter-spacing:.05em; }
  .hw-head span:first-of-type{ width:44px; text-align:center; }
  .hw-head span:last-of-type{ width:76px; text-align:right; }
  .hw-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid rgba(214,243,255,.14); }
  .hw-row label{ flex:1 1 auto; font-size:.85rem; color:var(--mist); }
  .hw-row input{ background:rgba(0,7,67,.5); border:1px solid rgba(214,243,255,.3); color:var(--paper); font-family:'Inter SemiBold'; font-size:.85rem; border-radius:var(--r-sm); padding:6px; }
  .hw-row input.hw-qty{ width:44px; text-align:center; }
  .hw-row input.hw-price{ width:76px; text-align:right; }
  .hw-row .unit{ font-size:.72rem; color:var(--grey3); }
</style>
</head>
<body>

<div id="app">

      <div class="page-hero" style="margin-bottom:20px">

</div>

<script src="../shared/i18n.js"></script>

<script>
(function(){
  "use strict";

  window.MunuHeader.inject({ logoSrc:"../logo/wordmark-light.png", homeHref:"../index.html", back:"../index.html" });

  var num = function(id){ var el = document.getElementById(id); var v = parseFloat(el.value); return isNaN(v) ? 0 : v; };
  var fmt = function(n){ return window.MunuState.formatKr(n); };
  var t = function(key){ return window.MunuI18n.t(key); };

  function row(labelKey, value, cls){
    return '<div class="result-row"><span>'+t(labelKey)+'</span><span class="amount'+(cls?" "+cls:"")+'">'+fmt(value)+'</span></div>';
  }
  function infoRow(labelKey, text){
    return '<div class="result-row"><span>'+t(labelKey)+'</span><span class="amount info">'+text+'</span></div>';
  }
  function setAmount(el, value){
    el.textContent = fmt(value);
    el.classList.toggle("negative", value < 0);
  }
  function field(id, labelKey, value, opts){
    opts = opts || {};
    var unit = opts.unit ? '<span class="unit">'+opts.unit+'</span>' : '';
    var step = opts.step !== undefined ? ' step="'+opts.step+'"' : '';
    var html = '<div class="field'+(opts.slider?' has-slider':'')+'"><label data-i18n="'+labelKey+'"></label>'+
      '<div class="field-input"><input type="number" id="'+id+'" value="'+value+'"'+step+'>'+unit+'</div></div>';
    if(opts.slider){
      html += '<div class="mini-slider-wrap"><input type="range" class="mini-slider" data-for="'+id+'" min="'+opts.slider.min+'" max="'+opts.slider.max+'" step="'+(opts.slider.step||opts.step||1)+'" value="'+value+'"></div>';
    }
    return html;
  }
  function hwRow(id, labelKey, qty, price){
    return '<div class="hw-row"><label data-i18n="'+labelKey+'"></label>'+
      '<input type="number" class="hw-qty" id="hw_'+id+'_qty" value="'+qty+'">'+
      '<input type="number" class="hw-price" id="hw_'+id+'_price" value="'+price+'"><span class="unit">kr</span>'+
      '</div>';
  }
  function includeRow(mod){
    return '<label class="check-row" style="margin-top:0;margin-bottom:18px"><input type="checkbox" id="inc_'+mod+'"'+(mod==="trans"?" checked":"")+'><span data-i18n="bfyInclude"></span></label>';
  }

  var MODULES = [
    { id:"trans", icon:"icon-trans", labelKey:"grwModTrans" },
    { id:"regnskap", icon:"icon-regnskap", labelKey:"grwModRegnskap" },
    { id:"multipay", icon:"icon-multipay", labelKey:"grwModMultipay" },
    { id:"booking", icon:"icon-booking", labelKey:"grwModBooking" },
    { id:"webshop", icon:"icon-webshop", labelKey:"grwModWebshop" },
    { id:"kiosk", icon:"icon-kiosk", labelKey:"grwModKiosk" },
    { id:"qr", icon:"icon-qr", labelKey:"grwModQr" }
  ];
  var LABELS = {
    trans:{ no:"Transaksjonskostnad", en:"Transaction cost" },
    regnskap:{ no:"Regnskapsintegrasjon", en:"Accounting integration" },
    multipay:{ no:"Multipay", en:"Multipay" },
    booking:{ no:"Booking", en:"Booking" },
    webshop:{ no:"Webshop Takeaway", en:"Webshop Takeaway" },
    kiosk:{ no:"Kiosk", en:"Kiosk" },
    qr:{ no:"Selvbetjent QR", en:"Self-service QR" }
  };

  // ---------------- build detail bodies ----------------
  var detailBody = document.getElementById("detailBody");

  function buildTransBody(){
    return (
      '<div class="module-detail-head"><h3 data-i18n="grwModTrans"></h3></div>' +
      includeRow("trans") +
      '<div class="box">' +
        field("t_omsetning", "bfyTransOmsetning", 5000000, { unit:"kr", slider:{min:0,max:50000000,step:10000} }) +
        field("t_antall", "bfyTransAntall", 15000, { slider:{min:0,max:50000,step:100} }) +
      '</div>' +
      '<div class="two-col" style="margin-top:20px">' +
        '<div class="box">' +
          '<div class="box-title" data-i18n="bfyTransKonkHead"></div>' +
          field("t_konkProsent", "bfyTransKonkProsent", 1.75, { unit:"%", step:0.01, slider:{min:0,max:5,step:0.01} }) +
          field("t_konkBehandling", "fieldProcessingFee", 0, { unit:"kr", step:0.01, slider:{min:0,max:10,step:0.01} }) +
          field("t_konkFixed", "bfyTotalFixedCost", 275, { unit:"kr", slider:{min:0,max:10000,step:50} }) +
        '</div>' +

          '<div class="preset-row" id="tierPresets" style="padding:4px 0 8px">' +
            '<button type="button" class="preset-btn active" data-value="0.55">IC++ 0.55%</button>' +
            '<button type="button" class="preset-btn" data-value="0.60">Tier 8 0.60%</button>' +
            '<button type="button" class="preset-btn" data-value="0.70">Tier 1 0.70%</button>' +
          '</div>' +
          field("t_munuBehandling", "fieldProcessingFee", 0.40, { unit:"kr", step:0.01 }) +
          field("t_setupTotal", "bfySetupTotal", 0, { unit:"kr" }) +
        '</div>' +
      '</div>' +
      '<div class="box" style="margin-top:20px">' +
        '<div class="box-title" data-i18n="hwSectionHead"></div>' +

        '<div class="result-total"><span data-i18n="bfyResSavings"></span><span class="amount" id="trans_savings"></span></div>' +
      '</div>'
    );
  }

          field("regn_modulkost", "grwRegnModulkost", 349, { unit:"kr", slider:{min:0,max:2000,step:10} }) +
          field("regn_setup", "grwRegnSetup", 3000, { unit:"kr", slider:{min:0,max:10000,step:100} }) +
        '</div>' +
        '<div class="box">' +
          '<div class="box-title" data-i18n="resSavings"></div>' +
          '<div id="regn_rows"></div>' +
          '<div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="regn_net"></span></div>' +
        '</div>' +
      '</div>'
    );
  }

  function buildMultipayBody(){
    return (
      '<div class="module-detail-head"><h3 data-i18n="grwModMultipay"></h3></div>' +
      includeRow("multipay") +
      '<div class="two-col">' +
        '<div class="box">' +
          field("mp_daily", "grwMpDaily", 30000, { unit:"kr", slider:{min:0,max:200000,step:1000} }) +
          field("mp_peakShare", "grwMpPeakShare", 40, { unit:"%", slider:{min:0,max:100,step:1} }) +
          field("mp_helgedager", "grwMpHelgedager", 96, { slider:{min:0,max:365,step:1} }) +
          '<div class="range-row">' +
            '<div class="range-row-head"><label data-i18n="grwMpGrowth"></label><span class="range-value" id="mp_growthLabel">30 %</span></div>' +
            '<input type="range" id="mp_growthSlider" min="5" max="60" value="30">' +
            '<div class="range-minmax"><span>5 %</span><span>60 %</span></div>' +
          '</div>' +
          field("mp_growthCustom", "grwMpGrowthCustom", 30, { unit:"%" }) +
          field("mp_modulkost", "grwMpModulkost", 235, { unit:"kr", slider:{min:0,max:2000,step:10} }) +
        '</div>' +
        '<div class="box">' +
          '<div class="box-title" data-i18n="grwResPerAr"></div>' +
          '<div id="mp_rows"></div>' +
          '<div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="mp_net"></span></div>' +
        '</div>' +
      '</div>'
    );
  }

  function buildBookingBody(){
    return (

      includeRow("booking") +
      '<div class="two-col">' +
        '<div class="box">' +
          field("bk_snittbord", "grwBkSnittbord", 850, { unit:"kr", slider:{min:0,max:5000,step:50} }) +
          field("bk_ekstraBookinger", "grwBkEkstraBookinger", 40, { slider:{min:0,max:500,step:5} }) +

  function buildWebshopBody(){
    return (
      '<div class="module-detail-head"><h3 data-i18n="grwModWebshop"></h3></div>' +

      '<div class="two-col">' +

      '<div class="module-detail-head"><h3 data-i18n="grwModKiosk"></h3></div>' +
      includeRow("kiosk") +
      '<div class="two-col">' +

          field("ki_modulkost", "grwKiModulkost", 1499, { unit:"kr", slider:{min:0,max:3000,step:10} }) +
        '</div>' +
        '<div class="box">' +
          '<div class="box-title" data-i18n="resSavings"></div>' +

          '<div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="ki_net"></span></div>' +
        '</div>' +
      '</div>'
    );
  }

  function buildQrBody(){
    return (
      '<div class="module-detail-head"><h3 data-i18n="grwModQr"></h3></div>' +
      includeRow("qr") +
      '<div class="two-col">' +
        '<div class="box">' +
          field("qr_snittordre", "grwQrSnittordreFor", 280, { unit:"kr", slider:{min:0,max:2000,step:10} }) +
          field("qr_okning", "grwQrOkning", 15, { unit:"%", slider:{min:0,max:100,step:1} }) +
          field("qr_antallOrdrer", "grwQrAntallOrdrer", 750, { slider:{min:0,max:10000,step:50} }) +
          field("qr_bemanning", "grwQrBemanningskutt", 0, { step:0.1, slider:{min:0,max:10,step:0.1} }) +
          field("qr_lonn", "grwKiLonn", 420000, { unit:"kr", slider:{min:0,max:1000000,step:5000} }) +
          field("qr_modulkost", "grwQrModulkost", 1385, { unit:"kr", slider:{min:0,max:3000,step:10} }) +
        '</div>' +
        '<div class="box">' +
          '<div class="box-title" data-i18n="resRevenueIncrease"></div>' +
          '<div id="qr_rows"></div>' +
          '<div class="result-total"><span data-i18n="resNet"></span><span class="amount" id="qr_net"></span></div>' +
        '</div>' +
      '</div>'
    );
  }

  var BUILDERS = { trans:buildTransBody, regnskap:buildRegnskapBody, multipay:buildMultipayBody, booking:buildBookingBody, webshop:buildWebshopBody, kiosk:buildKioskBody, qr:buildQrBody };

  MODULES.forEach(function(m){
    var wrap = document.createElement("div");
    wrap.className = "module-detail";
    wrap.id = "detail-" + m.id;
    wrap.hidden = true;
    wrap.innerHTML = BUILDERS[m.id]();
    detailBody.appendChild(wrap);
  });

  // ---------------- compute functions ----------------
  var HW_ITEMS = ["kasse", "adyenTerminal", "adyenPos"];
  function hardwareMonthly(){
    var monthly = 0;
    HW_ITEMS.forEach(function(key){ monthly += num("hw_" + key + "_qty") * num("hw_" + key + "_price"); });
    return monthly;
  }

  function renderTrans(){
    var antall = num("t_antall");
    var omsetning = num("t_omsetning");
    var konkFixed = num("t_konkFixed");
    var konkKost = omsetning * (num("t_konkProsent")/100) + antall * num("t_konkBehandling") + konkFixed * 12;

    var munuFixed = hardwareMonthly();
    var munuKost = omsetning * (num("t_munuProsent")/100) + antall * num("t_munuBehandling") + munuFixed * 12;
    var setupTotal = num("t_setupTotal");
    var savings = konkKost - munuKost;

    var A = (num("t_konkProsent") - num("t_munuProsent")) / 100;
    var B = antall * (num("t_munuBehandling") - num("t_konkBehandling")) + (munuFixed - konkFixed) * 12;
    var breakevenText;
    if(Math.abs(A) < 1e-9){
      breakevenText = B <= 0 ? t("alwaysProfitable") : t("neverProfitable");
    } else {
      var be = B / A;
      if(A > 0){
        breakevenText = be <= 0 ? t("alwaysProfitable") : fmt(be);
      } else {
        breakevenText = be <= 0 ? t("neverProfitable") : fmt(be);
      }
    }

    var snittPris = antall > 0 ? omsetning / antall : 0;

    document.getElementById("trans_rows").innerHTML =
      infoRow("bfySnittPris", fmt(snittPris)) +
      row("bfyTotalFixedCost", munuFixed) +
      row("bfyResKonkKost", konkKost) + row("bfyResMunuKost", munuKost) +
      (setupTotal > 0 ? row("bfySetupTotal", setupTotal, "negative") : "") +
      infoRow("breakevenRevenue", breakevenText);
    setAmount(document.getElementById("trans_savings"), savings);

    return { annualSavings:savings, annualRevenueIncrease:0, annualNetResult:savings };
  }

  function renderRegnskap(){
    var freq = num("regn_frekvens");
    var regnKost = num("regn_pris") * (num("regn_min")/60) * freq;
    var stabKost = num("regn_stabPris") * (num("regn_stabMin")/60) * 52;
    var modulkostAr = num("regn_modulkost") * 12;
    var setup = num("regn_setup");
    var totalCost = modulkostAr + setup;
    var net = regnKost + stabKost - modulkostAr;
    document.getElementById("regn_rows").innerHTML =
      row("bfyResRegnKost", regnKost) + row("bfyResStabKost", stabKost) +
      row("grwRegnModulkost", modulkostAr, "negative") + row("grwRegnSetup", setup, "negative") +
      row("breakevenSavings", totalCost, "info");
    setAmount(document.getElementById("regn_net"), net);
    return { annualSavings:regnKost + stabKost, annualRevenueIncrease:0, annualNetResult:net };
  }

  function renderMultipay(){
    var daily = num("mp_daily"), peakShare = num("mp_peakShare"), helgedager = num("mp_helgedager");
    var growth = num("mp_growthCustom");
    var peakDaily = daily * (peakShare/100);
    var perHelgedag = peakDaily * (growth/100);
    var perHelg = perHelgedag * 2;
    var perMnd = helgedager > 0 ? perHelgedag * (helgedager/12) : 0;
    var perAr = perHelgedag * helgedager;
    var vekstProsent = (daily > 0 && helgedager > 0) ? (perAr / (daily * helgedager)) * 100 : 0;
    var modulkost = num("mp_modulkost");
    var totalCost = modulkost * 12;
    var net = perAr - totalCost;
    document.getElementById("mp_rows").innerHTML =
      row("grwResPerHelgedag", perHelgedag) + row("grwResPerHelg", perHelg) +
      row("grwResPerMnd", perMnd) + row("grwResPerAr", perAr) +
      '<div class="result-row"><span>'+t("grwResVekstProsent")+'</span><span class="amount">'+vekstProsent.toFixed(1)+' %</span></div>' +
      row("resModuleCost", totalCost) +
      row("breakevenRevenueYear", totalCost, "info");
    setAmount(document.getElementById("mp_net"), net);
    return { annualSavings:0, annualRevenueIncrease:perAr, annualNetResult:net };
  }

  function renderBooking(){
    var ekstraMnd = num("bk_snittbord") * num("bk_ekstraBookinger");
    var revenueIncrease = ekstraMnd * 12;
    var modulkost = num("bk_modulkost");
    var totalCost = modulkost * 12;
    var net = revenueIncrease - totalCost;
    document.getElementById("bk_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) + row("resModuleCost", totalCost) +
      row("breakevenRevenueYear", totalCost, "info");
    setAmount(document.getElementById("bk_net"), net);
    return { annualSavings:0, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  function renderWebshop(){
    var revenueIncrease = num("ws_ekstraOms") * 12;
    var margin = num("ws_margin"), transPct = num("ws_trans");
    var bruttoresultat = revenueIncrease * (margin/100);
    var driftAr = num("ws_drift") * 12;
    var transKostAr = revenueIncrease * (transPct/100);
    var modulkostAr = num("ws_modulkost") * 12;
    var net = bruttoresultat - driftAr - transKostAr - modulkostAr;
    var rate = (margin - transPct) / 100;
    var totalFixed = driftAr + modulkostAr;
    var breakevenText = rate <= 0 ? t("neverProfitable") : fmt((totalFixed / rate) / 12);
    document.getElementById("ws_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) +
      '<div class="result-row"><span>'+t("grwWsMargin")+'</span><span class="amount">'+fmt(bruttoresultat)+'</span></div>' +
      row("grwWsDrift", driftAr) +
      '<div class="result-row"><span>'+t("grwWsTrans")+'</span><span class="amount negative">-'+fmt(transKostAr)+'</span></div>' +
      row("resModuleCost", modulkostAr) +
      infoRow("breakevenRevenueMonth", breakevenText);
    setAmount(document.getElementById("ws_net"), net);
    return { annualSavings:0, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  function renderKiosk(){
    var lonn = num("ki_lonn");
    var savings = num("ki_arsverk") * lonn;
    var modulkost = num("ki_modulkost");
    var totalCost = modulkost * 12;
    var net = savings - totalCost;
    var breakevenFte = lonn > 0 ? (totalCost / lonn).toFixed(2) : "–";
    document.getElementById("ki_rows").innerHTML =
      row("resSavings", savings) + row("resModuleCost", totalCost) +
      infoRow("breakevenFte", breakevenFte);
    setAmount(document.getElementById("ki_net"), net);
    return { annualSavings:savings, annualRevenueIncrease:0, annualNetResult:net };
  }

  function renderQr(){
    var ekstraOmsMnd = num("qr_snittordre") * (num("qr_okning")/100) * num("qr_antallOrdrer");
    var revenueIncrease = ekstraOmsMnd * 12;
    var bemanningsgevinst = num("qr_bemanning") * num("qr_lonn");
    var modulkost = num("qr_modulkost");
    var totalCost = modulkost * 12;
    var net = revenueIncrease + bemanningsgevinst - totalCost;
    var breakevenNeeded = totalCost - bemanningsgevinst;
    var breakevenText = breakevenNeeded <= 0 ? t("alwaysProfitable") : fmt(breakevenNeeded);
    document.getElementById("qr_rows").innerHTML =
      row("resRevenueIncrease", revenueIncrease) +
      '<div class="result-row"><span>'+t("grwQrBemanningskutt")+'</span><span class="amount">'+fmt(bemanningsgevinst)+'</span></div>' +
      row("resModuleCost", totalCost) +
      infoRow("breakevenRevenueYear", breakevenText);
    setAmount(document.getElementById("qr_net"), net);
    return { annualSavings:bemanningsgevinst, annualRevenueIncrease:revenueIncrease, annualNetResult:net };
  }

  var RENDERERS = { trans:renderTrans, regnskap:renderRegnskap, multipay:renderMultipay, booking:renderBooking, webshop:renderWebshop, kiosk:renderKiosk, qr:renderQr };

  // ---------------- sync / totals / nodes ----------------
  function updateGrandTotal(){
    var total = window.MunuState.totalNet();
    setAmount(document.getElementById("grandTotalHub"), total);
    setAmount(document.getElementById("grandTotalDetail"), total);
  }

  function updateNode(mod){
    var node = document.querySelector('.node[data-mod="'+mod+'"]');
    if(!node) return;
    var state = window.MunuState.getState();
    var entry = state["calc-" + mod];
    var included = !!(entry && entry.includedInTotal);
    node.classList.toggle("included", included);
    var amountEl = node.querySelector(".node-amount");
    amountEl.textContent = included ? fmt(entry.annualNetResult || 0) : "";
  }

  function syncModule(mod){
    var result = RENDERERS[mod]();
    var checked = document.getElementById("inc_" + mod).checked;
    if(checked){
      window.MunuState.setCalculator("calc-" + mod, {
        label: LABELS[mod],
        annualSavings: result.annualSavings,
        annualRevenueIncrease: result.annualRevenueIncrease,
        annualNetResult: result.annualNetResult,
        includedInTotal: true
      });
    } else {
      window.MunuState.clearCalculator("calc-" + mod);
    }
    updateNode(mod);
    updateGrandTotal();
  }

  function syncAll(){ MODULES.forEach(function(m){ syncModule(m.id); }); }

  document.querySelectorAll('#detailBody input[type=checkbox][id^="inc_"]').forEach(function(cb){
    cb.addEventListener("change", function(){ syncModule(cb.id.replace("inc_", "")); });
  });
  document.querySelectorAll(".module-detail input, .module-detail select").forEach(function(el){
    if(el.type === "checkbox") return;
    var handler = function(){ syncModule(el.closest(".module-detail").id.replace("detail-", "")); };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });

  function wireTierPresets(rowId, targetFieldId, mod){
    document.querySelectorAll("#" + rowId + " .preset-btn").forEach(function(b){
      b.addEventListener("click", function(){
        document.getElementById(targetFieldId).value = b.dataset.value;
        document.querySelectorAll("#" + rowId + " .preset-btn").forEach(function(x){ x.classList.toggle("active", x === b); });
        syncModule(mod);
      });
    });
  }
  wireTierPresets("tierPresets", "t_munuProsent", "trans");
  wireTierPresets("tierPresetsWs", "ws_trans", "webshop");

  var mpSlider = document.getElementById("mp_growthSlider");
  var mpCustom = document.getElementById("mp_growthCustom");
  var mpLabel = document.getElementById("mp_growthLabel");
  mpSlider.addEventListener("input", function(){
    mpCustom.value = mpSlider.value;
    mpLabel.textContent = mpSlider.value + " %";
    syncModule("multipay");
  });
  mpCustom.addEventListener("input", function(){
    var v = parseFloat(mpCustom.value) || 0;
    mpLabel.textContent = v + " %";
    if(v >= 5 && v <= 60){ mpSlider.value = v; }
    syncModule("multipay");
  });

  document.querySelectorAll(".mini-slider").forEach(function(rangeEl){
    var numberEl = document.getElementById(rangeEl.dataset.for);
    if(!numberEl) return;
    rangeEl.value = numberEl.value;
    rangeEl.addEventListener("input", function(){
      numberEl.value = rangeEl.value;
      numberEl.dispatchEvent(new Event("input", { bubbles:true }));
    });
    numberEl.addEventListener("input", function(){
      var v = parseFloat(numberEl.value);
      if(isNaN(v)) return;
      var min = parseFloat(rangeEl.min), max = parseFloat(rangeEl.max);
      if(v >= min && v <= max) rangeEl.value = v;
    });
  });

  // ---------------- wheel nodes + navigation ----------------
  var nodesEl = document.getElementById("nodes");
  var wipeEl = document.getElementById("wipe");

  function buildNodes(){
    MODULES.forEach(function(m){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "node";
      btn.dataset.mod = m.id;
      btn.innerHTML =
        '<svg class="node-icon"><use href="#'+m.icon+'"/></svg>'+
        '<span class="node-label" data-i18n="'+m.labelKey+'"></span>'+
        '<span class="node-amount"></span>';
      btn.addEventListener("click", function(){ openModule(m.id); });
      nodesEl.appendChild(btn);
    });
  }

  function layoutOrbit(){
    var rect = nodesEl.getBoundingClientRect();
    var cx = rect.width/2, cy = rect.height/2;
    var radius = Math.min(rect.width, rect.height)/2 - 6;
    var items = nodesEl.querySelectorAll(".node");
    items.forEach(function(el, i){
      var angle = (i/MODULES.length)*Math.PI*2 - Math.PI/2;
      var x = cx + radius*Math.cos(angle);
      var y = cy + radius*Math.sin(angle);
      el.style.left = (x - el.offsetWidth/2)+"px";
      el.style.top = (y - el.offsetHeight/2)+"px";
    });
  }

  function debounce(fn, ms){ var tm; return function(){ clearTimeout(tm); tm = setTimeout(fn, ms); }; }

  function swapView(view, mod){
    document.getElementById("view-hub").classList.toggle("active", view === "hub");
    document.getElementById("view-detail").classList.toggle("active", view === "detail");
    if(view === "detail" && mod){
      MODULES.forEach(function(m){ document.getElementById("detail-" + m.id).hidden = (m.id !== mod); });
      window.scrollTo(0,0);
    }
  }

  function wipeTo(view, mod){
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduced){ swapView(view, mod); return; }
    wipeEl.classList.remove("sweeping");
    void wipeEl.offsetWidth;
    wipeEl.classList.add("sweeping");
    setTimeout(function(){ swapView(view, mod); }, 400);
    setTimeout(function(){ wipeEl.classList.remove("sweeping"); }, 820);
  }

  function openModule(id){ wipeTo("detail", id); }

  document.getElementById("backBtn").addEventListener("click", function(){ wipeTo("hub"); });

  document.addEventListener("munu:langchange", syncAll);

  buildNodes();
  layoutOrbit();
  window.addEventListener("resize", debounce(layoutOrbit, 150));
  syncAll();
})();
</script>
</body>
</html>
